[package]
name = "sconfig"
version = "0.2.0"
edition = "2021"
description = "Offline game configuration manager"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:rfd", "dep:notify"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[[bin]]
name = "sconfig"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-single-instance = {version="2",optional=true}
anyhow = "1"
base64 = "0.22"
notify = {version="8",optional=true}
rfd = {version="0.15",optional=true}
rusqlite = { version = "0.34", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
steamlocate = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
quick-xml = {version="0.42",features= ["serialize"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }
